# /etc/nginx/sites-available/msp-api  — replace api.example.com with your API_DOMAIN
# and 5007 with your API_PORT. Then:
#   sudo ln -s /etc/nginx/sites-available/msp-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com        # adds HTTPS + auto-renewal
server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 12m;   # attachments are up to 10 MB

    location / {
        proxy_pass http://127.0.0.1:5007;
        proxy_http_version 1.1;
        # WebSockets (live notifications / counts)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
