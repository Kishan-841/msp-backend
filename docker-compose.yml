# MSP CRM backend on one VM: Postgres + API + Caddy (HTTPS with a free, auto-renewed certificate).
# 1. cp .env.example .env  and fill it in     2. point API_DOMAIN's DNS at this VM
# 3. docker compose up -d --build              Details: DEPLOY.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-msp_crm}
      POSTGRES_USER: ${POSTGRES_USER:-msp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # not published: only the API reaches it, over the private compose network

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-msp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-msp_crm}
      PORT: 5001
      NODE_ENV: production
      TRUST_PROXY: 1 # behind Caddy
    volumes:
      - uploads:/app/uploads # attached files survive rebuilds
    depends_on:
      db:
        condition: service_healthy
    # not published: Caddy forwards to it

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
