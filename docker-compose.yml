# MSP CRM backend on one VM: Postgres + API.
# The API listens on 127.0.0.1:${API_PORT} only — the VM's existing reverse proxy (nginx) serves it
# over HTTPS (docker/nginx.conf). No reverse proxy on the VM? Add Caddy: --profile caddy.
# 1. cp .env.example .env and fill it in   2. docker compose up -d --build   Details: DEPLOY.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-msp_crm}
      POSTGRES_USER: ${POSTGRES_USER:-msp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # not published: only the API reaches it, over the private compose network

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-msp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-msp_crm}
      PORT: 5001
      NODE_ENV: production
      TRUST_PROXY: 1 # behind Caddy
    volumes:
      - uploads:/app/uploads # attached files survive rebuilds
    ports:
      - "127.0.0.1:${API_PORT:-5007}:5001" # localhost only — nginx on the VM forwards to it
    depends_on:
      db:
        condition: service_healthy

  # Optional — only for a VM with nothing on ports 80/443:  docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
